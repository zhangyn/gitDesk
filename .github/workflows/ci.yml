name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Release 需要写权限（创建 release / 上传附件）
permissions:
  contents: write

jobs:
  frontend:
    name: 前端（类型 / 验证 / 构建）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 代码规范（ESLint）
        run: npm run lint

      - name: 格式检查（Prettier）
        run: npm run format:check

      # 207 项断言：用真实 git 造合并/冲突/中文路径/CRLF 等场景
      - name: 端到端验证
        run: npm run verify

      - name: 生产构建
        run: npm run build

  rust:
    name: Rust（cargo check）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  bundle:
    name: 打包安装包
    # PR 不打包（省时间）；main 上每次提交产 artifact，打 tag 时另外发 Release
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri build 会先跑 beforeBuildCommand（npm run build），再编 Rust、最后调 NSIS
      - name: 构建 NSIS 安装包
        run: npx tauri build

      - name: 记录安装包体积
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            '{0}  {1:N2} MiB' -f $_.Name, ($_.Length / 1MB)
          }

      # 每次 main 的提交都能下载一个可运行的安装包（方便自己试）
      - uses: actions/upload-artifact@v4
        with:
          name: GitDesk-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # 打 v* tag 时发布到 Releases（README 里的下载链接指向这里）
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
