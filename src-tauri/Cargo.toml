[package]
name = "gitdesk"
version = "0.1.0"
description = "GitDesk — 轻量 Git 图形客户端"
authors = ["GitDesk"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gitdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
